[project]
name = "image-gen"
version = "0.1.0"
description = "Image generation, analysis, and search foundation for the Databricks Vision repo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.21.0",
    "pillow",
    "python-dotenv>=1.2.1",
    "databricks-sdk>=0.40",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "matplotlib>=3.9",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["image_gen.py"]

[tool.hatch.build.targets.sdist]
only-include = ["image_gen.py", "README.md"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["notebooks", "app/.build", "app/.apx", "app/node_modules"]

[tool.ruff.lint]
# Start with the fatal set only (syntax errors, undefined names) so CI is a hard, zero-noise gate.
# Widening to F401/I is a follow-up — note core/dependencies.py relies on a side-effect import.
select = ["E9", "F63", "F7", "F82"]
